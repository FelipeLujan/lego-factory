<!doctype html>
<!--
  ROOT COMPOSITION. You normally never edit this file.
  Lengths marked data-film-length and the voice length are rewritten by `python tools/build.py`.
  To add music later: uncomment the <audio id="music"> line and set its src (see PLAYBOOK.md section 9).
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-accent","type":"color","label":"Accent","default":"#FF6B4A"},
    {"id":"color-accent-2","type":"color","label":"Accent 2","default":"#C8FF3E"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <script src="assets/cues.js"></script>
    <script src="assets/film.js"></script>
    <script src="assets/render-profile.js"></script>
    <script src="assets/ldraw-parts.js"></script>
    <script src="assets/brick-kit.js"></script>
    <script src="assets/fx-kit.js"></script>
    <script src="assets/ldraw-kit.js"></script>
    <script src="assets/props-kit.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      :root {
        --color-accent: #ff6b4a;
        --color-accent-2: #c8ff3e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-film-length data-start="0" data-duration="110.6" data-fps="30" data-width="1080" data-height="1920">
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html" data-film-length data-start="0" data-duration="110.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-film-length data-start="0" data-duration="110.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-film-length data-start="0" data-duration="110.6" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 3"></div>

      <audio id="voice" class="clip" src="assets/voice/voice-mix.wav" data-start="0" data-duration="108.203" data-track-index="10" data-volume="1"></audio>
      <audio id="sfx-bed" class="clip" src="assets/sfx/sfx-bed.wav" data-film-length data-start="0" data-duration="110.6" data-track-index="11" data-volume="0.46"></audio>
      <!-- <audio id="music" class="clip" src="assets/music/track.mp3" data-film-length data-start="0" data-duration="110.6" data-track-index="12" data-volume="0.14" data-fade-out="1.5"></audio> -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
